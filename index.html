<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>People Counter - Fullscreen</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- TensorFlow.js & COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body class="bg-black text-white h-[100dvh] w-screen overflow-hidden select-none relative font-sans">

  <!-- Viewfinder: Video & Canvas Full Layar -->
  <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>
  <canvas id="canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

  <!-- Overlay UI Bagian Atas (Header & Counter) -->
  <div class="absolute top-0 inset-x-0 p-4 pt-6 z-20 flex justify-between items-start pointer-events-none bg-gradient-to-b from-black/80 via-black/30 to-transparent">
    <div class="pointer-events-auto">
      <h1 class="text-base font-bold tracking-tight text-emerald-400 drop-shadow">People Counter</h1>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span id="statusDot" class="h-2 w-2 rounded-full bg-amber-400"></span>
        <span id="aiStatus" class="text-[11px] text-slate-300 drop-shadow">Memuat AI...</span>
      </div>
    </div>

    <!-- Badge Jumlah Orang -->
    <div class="pointer-events-auto bg-black/60 backdrop-blur-md border border-white/15 px-4 py-2 rounded-2xl flex items-center gap-3 shadow-2xl">
      <span class="text-xs uppercase tracking-wider text-slate-400 font-medium">Orang</span>
      <span id="peopleCount" class="text-3xl font-extrabold text-white">0</span>
    </div>
  </div>

  <!-- Layar Sambutan / Pesan Kamera Belum Aktif -->
  <div id="noticeBox" class="absolute inset-0 z-15 flex flex-col items-center justify-center p-6 text-center bg-black/80 backdrop-blur-sm pointer-events-none">
    <p id="noticeText" class="text-slate-300 text-sm max-w-xs">Kamera belum aktif. Tekan tombol <strong class="text-emerald-400">Mulai</strong> di bawah.</p>
    <p id="errorMsg" class="text-rose-400 text-xs font-mono mt-3 hidden max-w-xs bg-rose-950/70 p-2.5 rounded-lg border border-rose-800 pointer-events-auto"></p>
  </div>

  <!-- Overlay UI Bagian Bawah (Tombol Kontrol Mengambang) -->
  <div class="absolute bottom-0 inset-x-0 p-6 pb-8 z-20 flex items-center justify-center gap-4 bg-gradient-to-t from-black/90 via-black/40 to-transparent">
    <!-- Tombol Balik Kamera Depan / Belakang -->
    <button id="switchCamBtn" class="bg-white/10 hover:bg-white/20 active:scale-90 text-white backdrop-blur-md border border-white/20 h-14 w-14 rounded-full flex items-center justify-center shadow-lg transition-transform" title="Balik Kamera">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>

    <!-- Tombol Start / Stop Kamera -->
    <button id="toggleCamBtn" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold text-sm px-7 h-14 rounded-full shadow-xl flex items-center gap-2 transition-all">
      <span>Nyalakan Kamera</span>
    </button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('peopleCount');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const aiStatus = document.getElementById('aiStatus');
    const statusDot = document.getElementById('statusDot');
    const noticeBox = document.getElementById('noticeBox');
    const noticeText = document.getElementById('noticeText');
    const errorMsg = document.getElementById('errorMsg');

    let model = null;
    let isCamRunning = false;
    let isDetecting = false;
    let facingMode = 'environment'; // Default kamera belakang di HP

    // Samakan ukuran pixel canvas dengan ukuran layar fisik browser
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. Inisialisasi Model COCO-SSD
    async function loadModel() {
      try {
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        aiStatus.innerText = "Model Siap";
        statusDot.className = "h-2 w-2 rounded-full bg-emerald-400 animate-pulse";
        if (isCamRunning && !isDetecting) {
          detectLoop();
        }
      } catch (err) {
        console.error("Gagal load AI:", err);
        aiStatus.innerText = "AI Gagal";
        statusDot.className = "h-2 w-2 rounded-full bg-rose-500";
      }
    }
    loadModel();

    // 2. Fungsi Menjalankan Kamera
    async function startCamera() {
      noticeText.innerText = "Membuka kamera...";
      errorMsg.classList.add('hidden');
      toggleCamBtn.disabled = true;

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        isCamRunning = true;
        resizeCanvas();
        noticeBox.classList.add('hidden');
        toggleCamBtn.innerText = "Matikan";
        toggleCamBtn.className = toggleCamBtn.className.replace('bg-emerald-600 hover:bg-emerald-500', 'bg-rose-600 hover:bg-rose-500');
        toggleCamBtn.disabled = false;

        if (model && !isDetecting) {
          detectLoop();
        }
      } catch (err) {
        console.error("Camera Error:", err);
        noticeBox.classList.remove('hidden');
        noticeText.innerText = "Kamera gagal dibuka";
        errorMsg.innerText = `${err.name}: ${err.message}`;
        errorMsg.classList.remove('hidden');
        toggleCamBtn.innerText = "Nyalakan Kamera";
        toggleCamBtn.disabled = false;
      }
    }

    // 3. Matikan Kamera
    function stopCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
      }
      isCamRunning = false;
      isDetecting = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      countDisplay.innerText = "0";
      noticeBox.classList.remove('hidden');
      noticeText.innerText = "Kamera nonaktif.";
      toggleCamBtn.innerText = "Nyalakan Kamera";
      toggleCamBtn.className = toggleCamBtn.className.replace('bg-rose-600 hover:bg-rose-500', 'bg-emerald-600 hover:bg-emerald-500');
    }

    // 4. Deteksi Real-Time + Mapping Bounding Box ke Fullscreen (object-cover)
    async function detectLoop() {
      if (!isCamRunning || !model) {
        isDetecting = false;
        return;
      }

      isDetecting = true;

      if (video.readyState >= 2) {
        try {
          const predictions = await model.detect(video);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const people = predictions.filter(p => p.class === 'person' && p.score >= 0.5);

          // Hitung rasio & offset object-cover agar koordinat box tidak meleset di layar penuh
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          const cw = canvas.width;
          const ch = canvas.height;

          if (vw && vh) {
            const scale = Math.max(cw / vw, ch / vh);
            const offsetX = (cw - vw * scale) / 2;
            const offsetY = (ch - vh * scale) / 2;

            people.forEach((p, idx) => {
              const [rawX, rawY, rawW, rawH] = p.bbox;
              const x = rawX * scale + offsetX;
              const y = rawY * scale + offsetY;
              const w = rawW * scale;
              const h = rawH * scale;

              // Bounding Box
              ctx.strokeStyle = '#10b981';
              ctx.lineWidth = 3;
              ctx.strokeRect(x, y, w, h);

              // Background Label
              ctx.fillStyle = '#10b981';
              const label = `Person #${idx + 1} (${Math.round(p.score * 100)}%)`;
              ctx.font = 'bold 12px sans-serif';
              const textWidth = ctx.measureText(label).width;
              ctx.fillRect(x, y > 22 ? y - 22 : y, textWidth + 8, 20);

              // Teks Label
              ctx.fillStyle = '#ffffff';
              ctx.fillText(label, x + 4, y > 22 ? y - 7 : y + 15);
            });
          }

          countDisplay.innerText = people.length;
        } catch (e) {
          console.warn("Frame skip:", e);
        }
      }

      requestAnimationFrame(detectLoop);
    }

    // Handler Tombol
    toggleCamBtn.addEventListener('click', () => {
      if (!isCamRunning) startCamera();
      else stopCamera();
    });

    switchCamBtn.addEventListener('click', async () => {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      if (isCamRunning) await startCamera();
    });
  </script>
</body>
</html>
